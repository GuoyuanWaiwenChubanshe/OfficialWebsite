name: Update sitemap only

on:
  push:
    branches: ["main"]

permissions:
  contents: write  # Changed from read to write for committing

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate sitemap with lastmod dates
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://www.boomgaard.org/
          path-to-root: ./
          drop-html-extension: true

      - name: Commit and push updated sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git diff --staged --quiet || (git commit -m "Update sitemap [skip ci]" && git push)
