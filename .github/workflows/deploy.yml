name: Update sitemap and deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://www.boomgaard.org/
          path-to-root: ./
          drop-html-extension: true

      - name: Commit and push sitemap if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f "sitemap.xml" ]; then
            git add sitemap.xml
            if git diff --staged --quiet; then
              echo "No changes to sitemap"
            else
              git commit -m "Update sitemap [skip ci]"
              git push origin HEAD:main
            fi
          else
            echo "sitemap.xml not found"
          fi

      # 🔽 NEW STEP: Inject the GA ID from Secrets 🔽
      - name: Inject Google Analytics ID
        run: |
          if [ -n "${{ secrets.GA_MEASUREMENT_ID }}" ]; then
            find . -name "*.html" -exec sed -i "s/{{ GA_MEASUREMENT_ID }}/${{ secrets.GA_MEASUREMENT_ID }}/g" {} \;
            echo "GA ID injected successfully."
          else
            echo "Warning: GA_MEASUREMENT_ID secret not set. Skipping injection."
          fi

      - name: Build site with sitemap
        run: |
          mkdir -p _site
          cp -r ./* _site/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
