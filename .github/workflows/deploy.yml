name: Deploy site to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build your site
        run: |
          mkdir _site
          cp -r ./* _site/ 2>/dev/null || true

      - name: Create IndexNow verification file
        run: echo "${{ secrets.INDEXNOW_KEY }}" > _site/${{ secrets.INDEXNOW_KEY }}.txt

      - name: Submit sitemap to IndexNow
        run: |
          cat > payload.json <<EOF
          {
            "host": "www.boomgaard.org",
            "key": "${{ secrets.INDEXNOW_KEY }}",
            "keyLocation": "https://www.boomgaard.org/${{ secrets.INDEXNOW_KEY }}.txt",
            "urlList": ["https://www.boomgaard.org/sitemap.xml"]
          }
          EOF
          curl -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d @payload.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
