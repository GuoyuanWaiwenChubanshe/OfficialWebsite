name: Update sitemap and deploy

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate sitemap
        uses: cicirello/generate-sitemap@v1
        with:
          base-url-path: https://www.boomgaard.org/
          path-to-root: ./
          drop-html-extension: true

      - name: Commit and push sitemap if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f "sitemap.xml" ]; then
            git add sitemap.xml
            if git diff --staged --quiet; then
              echo "No changes to sitemap"
            else
              git commit -m "Update sitemap [skip ci]"
              git push origin HEAD:main
            fi
          else
            echo "sitemap.xml not found"
          fi

      # 🔽 COMBINED STEP: Inject all tracking IDs from Secrets 🔽
      - name: Inject tracking IDs from secrets
        env:
          GTM_ID: ${{ secrets.GTM_ID }}
          GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
          META_PIXEL_ID: ${{ secrets.META_PIXEL_ID }}
          TIKTOK_PIXEL_ID: ${{ secrets.TIKTOK_PIXEL_ID }}
          X_PIXEL_ID: ${{ secrets.X_PIXEL_ID }}
          COOKIEBOT_ID: ${{ secrets.COOKIEBOT_ID }}   # <-- ADDED
        run: |
          # Google Tag Manager
          if [ -n "$GTM_ID" ]; then
            find . -type f -name "*.html" -exec sed -i "s|__GTM_CONTAINER_ID__|$GTM_ID|g" {} +
            echo "GTM ID injected."
          else
            echo "Warning: GTM_ID secret not set. Skipping."
          fi

          # Google Analytics 4
          if [ -n "$GA_MEASUREMENT_ID" ]; then
            find . -type f -name "*.html" -exec sed -i "s|{{ GA_MEASUREMENT_ID }}|$GA_MEASUREMENT_ID|g" {} +
            echo "GA ID injected."
          else
            echo "Warning: GA_MEASUREMENT_ID secret not set. Skipping."
          fi

          # Meta Pixel
          if [ -n "$META_PIXEL_ID" ]; then
            find . -type f -name "*.html" -exec sed -i "s|__META_PIXEL_ID__|$META_PIXEL_ID|g" {} +
            echo "Meta Pixel ID injected."
          else
            echo "Warning: META_PIXEL_ID secret not set. Skipping."
          fi

          # TikTok Pixel
          if [ -n "$TIKTOK_PIXEL_ID" ]; then
            find . -type f -name "*.html" -exec sed -i "s|__TIKTOK_PIXEL_ID__|$TIKTOK_PIXEL_ID|g" {} +
            echo "TikTok Pixel ID injected."
          else
            echo "Warning: TIKTOK_PIXEL_ID secret not set. Skipping."
          fi

          # X (Twitter) Pixel
          if [ -n "$X_PIXEL_ID" ]; then
            find . -type f -name "*.html" -exec sed -i "s|__X_PIXEL_ID__|$X_PIXEL_ID|g" {} +
            echo "X Pixel ID injected."
          else
            echo "Warning: X_PIXEL_ID secret not set. Skipping."
          fi

          # Cookiebot                                      # <-- ADDED BLOCK
          if [ -n "$COOKIEBOT_ID" ]; then
            find . -type f -name "*.html" -exec sed -i "s|__COOKIEBOT_ID__|$COOKIEBOT_ID|g" {} +
            echo "Cookiebot ID injected."
          else
            echo "Warning: COOKIEBOT_ID secret not set. Skipping."
          fi

      - name: Build site with sitemap
        run: |
          mkdir -p _site
          cp -r ./* _site/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
